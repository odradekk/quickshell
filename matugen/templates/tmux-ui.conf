# Clavis · GENERATED by matugen · do not edit
# Source: matugen/templates/tmux-ui.conf
# 形态语汇 D（设计稿 §11-B）：栏是玻璃，只有活动窗口成重音药丸。
# 重音分配 B′（§11-C）：活动=accent · prefix=accent2 · zoom=warning
# · copy=info · sync=整条反白（danger 与 accent 不可辨，ΔE00 夜 7.2）。
# 颜色一律小写：tmux 会把 style 中的 #F 当旧式别名吃掉（§11 实现注）。

# --- 位置与长度 ---
# 置底：Clavis 顶栏已占据屏幕顶部，置顶会形成两层紧邻的 chrome 带。
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# --- 栏底：默认背景 = 继承 kitty 的 background_opacity ---
# 用 default 而非 surface 的字面色：这样即便 kitty 的 background 变了，
# 状态栏也始终跟着走，不会退化成实底。sync 时整条翻成 danger。
set -g status-style "bg=#{?pane_synchronized,{{ colors.glass_danger.default.hex }},default},fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.on_surface.default.hex }}}"

# --- status-left：prefix 药丸 + 会话名 ---
set -g status-left "#{?client_prefix,#[fg={{ colors.glass_accent2.default.hex }}]#[fg={{ colors.surface.default.hex }}]#[bg={{ colors.glass_accent2.default.hex }}]#[bold]  #[default]#[fg={{ colors.glass_accent2.default.hex }}] ,}#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.on_surface.default.hex }}}]#[bold] #S#[default]   "

# --- 窗口 tab ---
set -g window-status-separator "  "
set -g window-status-current-format "#{?pane_synchronized,#[bold]#I #W,#[fg={{ colors.glass_accent.default.hex }}]#[fg={{ colors.surface.default.hex }}]#[bg={{ colors.glass_accent.default.hex }}]#[bold]#I #W #[default]#[fg={{ colors.glass_accent.default.hex }}]}"
set -g window-status-format "#{?pane_synchronized,#[nobold]#{?#{e|>=:#{window_width},80},#I #W,#I},#[fg={{ colors.outline.default.hex }}]#{?#{e|>=:#{window_width},80},#I #W,#I}}"

# --- status-right：只放 tmux 独有的瞬态 + 时钟 ---
set -g status-right "#{?window_zoomed_flag,#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.glass_warning.default.hex }}}] zoom#[default]   ,}#{?pane_in_mode,#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.glass_info.default.hex }}}] copy#[default]   ,}#{?pane_synchronized,#[fg={{ colors.surface.default.hex }}]#[bold] SYNC#[default]   ,}#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.on_surface.default.hex }}}]%H:%M"

# --- 远程会话才显示主机名 ---
# 本机恒定的主机名是零信息。SSH 进来时 tmux server 的环境里有
# SSH_CONNECTION，据此在<载入时>决定加不加这一段。
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g status-right "#{?window_zoomed_flag,#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.glass_warning.default.hex }}}] zoom#[default]   ,}#{?pane_in_mode,#[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.glass_info.default.hex }}}] copy#[default]   ,}#{?pane_synchronized,#[fg={{ colors.surface.default.hex }}]#[bold] SYNC#[default]   ,}#[fg={{ colors.on_surface_variant.default.hex }}]#H   #[fg=#{?pane_synchronized,{{ colors.surface.default.hex }},{{ colors.on_surface.default.hex }}}]%H:%M"'

# --- pane 边框 ---
# 非活动 pane 不压暗：日間把子区域压暗会落进中灰死区，
# muted 掉到 3.37、faint 掉到 2.04（设计稿 §11-F 实算）。
set -g pane-border-lines single
set -g pane-border-style "fg={{ colors.outline_variant.default.hex }}"
set -g pane-active-border-style "fg={{ colors.glass_accent.default.hex }}"

# --- 消息栏 / 命令栏 ---
set -g message-style "bg={{ colors.glass_accent2.default.hex }},fg={{ colors.surface.default.hex }}"
set -g message-command-style "bg={{ colors.surface_container_high.default.hex }},fg={{ colors.on_surface.default.hex }}"

# --- copy-mode 选区 ---
set -g mode-style "bg={{ colors.secondary_container.default.hex }},fg={{ colors.on_surface.default.hex }}"

# --- 时钟（prefix + t）---
set -g clock-mode-colour "{{ colors.glass_accent.default.hex }}"
set -g clock-mode-style 24
