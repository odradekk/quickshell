"$schema" = 'https://starship.rs/config-schema.json'

# Clavis · GENERATED by matugen · do not edit
# Source: matugen/templates/starship.toml
#
# 提示符只回答一个问题：我在哪。
# 时间 tmux 说了，项目名 tmux 的标签说了，语言版本没人问。
#
# 两行：上面一行是分隔线（滚屏找上一条命令时眼睛找的就是它），
# 下面一行让你写。所以上面那行是唯一带颜色的，❯ 不带。

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$line_break\
$character"""

# 右边只放刚刚发生的事：跑了多久、退出码是几。
# 这两件事只跟上一条命令有关，跟你在哪无关。
# 配 .zshrc 里的 TRANSIENT_RPROMPT —— 历史行里它会消失。
right_format = "$status$cmd_duration"

add_newline = true


# ── 路径 · 唯一的锚点 ───────────────────────────────────────────
# 路径是两件事：仓库名是坐标系（一天也不变），
# 仓库内的位置是答案（一直在动）。
#
# 两者同色不同重，而不是一暗一亮 —— 因为你有一半时间待在仓库根目录，
# 那时 $path 是空的，仓库名要是压到 faint，整条提示符就没有锚点了，
# 滚屏时找不到上一条命令从哪开始。层级交给字重，颜色保证锚点始终在。
[directory]
style = "bold {{ colors.glass_amber.default.hex }}"
repo_root_style = "{{ colors.glass_amber.default.hex }}"
before_repo_root_style = "{{ colors.outline.default.hex }}"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "{{ colors.glass_danger.default.hex }}"


# ── ❯ · 不带颜色，除非出事 ──────────────────────────────────────
# 「成功」是默认状态，让默认状态发光会把真正的异常淡化。
[character]
success_symbol = "[❯]({{ colors.on_surface_variant.default.hex }})"
error_symbol = "[❯]({{ colors.glass_danger.default.hex }})"
vimcmd_symbol = "[❮]({{ colors.glass_info.default.hex }})"


# ── git · 两类事实，两个颜色 ────────────────────────────────────
# 「我改了东西」去 commit，「我跟远端不同步」去 pull。
# 反应不同，所以颜色不同。分支名是坐标不是警报，不占重音。
[git_branch]
symbol = ""
style = "{{ colors.on_surface_variant.default.hex }}"
format = "  [$branch]($style)"

[git_status]
# 每一项自带前导空格 —— 否则 ●2?1 会连成一个符号串，
# 「2」和「?」挨在一起会被读成「2?」。
format = "([$all_status]({{ colors.glass_warning.default.hex }}))([$ahead_behind]({{ colors.glass_info.default.hex }}))"
conflicted = " !${count}"
modified = " ●${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " ✘${count}"
renamed = " »${count}"
stashed = " ≡${count}"
typechanged = ""
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

# 半途而废的 rebase / merge 必须被看见 —— 它拦着你做别的事。
[git_state]
style = "bold {{ colors.glass_danger.default.hex }}"
format = '\([$state( $progress_current/$progress_total)]($style)\) '


# ── python · 只说虚拟环境的名字 ─────────────────────────────────
# 版本号不说：这台机器上每个工具链都只有一个版本，
# 一个永不变化的数字每敲一次回车就打印一遍。
# 虚拟环境的名字留着，因为那个真的会变。
[python]
style = "{{ colors.glass_cyan.default.hex }}"
format = '([ \($virtualenv\)]($style))'


# ── 右侧 · 瞬态 ─────────────────────────────────────────────────
[status]
disabled = false
style = "{{ colors.glass_danger.default.hex }}"
format = "[✗$status]($style)"
map_symbol = false
pipestatus = false

[cmd_duration]
min_time = 2000
style = "{{ colors.outline.default.hex }}"
format = "  [$duration]($style)"
show_milliseconds = false
