# Mirror the system authentication stack rather than calling pam_unix alone.
# Without pam_faillock the lock screen accepts unlimited password guesses,
# which is the weakest link for an attacker with physical access.
#
# pam_faillock works from this user-space process: the tally under
# /run/faillock is writable for the invoking user and the lockout triggers as
# expected. It logs "Error sending audit message: Operation not permitted"
# because the audit subsystem needs privileges; that is cosmetic and does not
# affect the decision.
auth       required                    pam_faillock.so      preauth
auth       [success=1 default=bad]     pam_unix.so          try_first_pass nullok
auth       [default=die]               pam_faillock.so      authfail
auth       required                    pam_faillock.so      authsucc
